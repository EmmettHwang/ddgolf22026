<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>홈페이지유지관리 · 대덕구골프협회</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <!--
    홈페이지유지관리비 결제 화면 (2026-09-13)
    ⚠️ React 화면(SPA)이 아니라 **독립된 정적 페이지**다. 요금·결제는 Django 가 아니라
       호스트의 site-switch 가 맡고, nginx 가 /api/server-billing* 을 그리로 넘긴다.
       (결제 열쇠를 사이트마다 복사해 두지 않으려고 한 곳에 모았다)
    ⚠️ 교수오빠 지시(2026-09-13): 「A+B로 해」 = 카드 + 가상계좌. 정기결제는 안 한다.
  -->
  <style>
    :root { --line:#e5e7eb; --muted:#6b7280; --green:#15803d; }
    * { box-sizing: border-box; }
    body { margin:0; background:#f9fafb; color:#111827;
           font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif; line-height:1.6; }
    .wrap { max-width:760px; margin:0 auto; padding:28px 20px 60px; }
    .top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px; }
    .top a { color:var(--muted); text-decoration:none; font-size:14px; }
    .top a:hover { color:#111827; }
    h1 { font-size:22px; margin:0 0 4px; }
    .sub { color:var(--muted); font-size:14px; margin:0 0 22px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px; }
    .row { display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:10px; }
    .fee { font-size:30px; font-weight:800; letter-spacing:-.5px; }
    .lbl { color:var(--muted); font-size:13px; }
    .due { text-align:right; }
    .due b { font-size:19px; }
    .pill { display:inline-block; font-size:12px; font-weight:700; border-radius:999px;
            padding:2px 9px; background:#eef2f7; color:#374151; }
    .pill.warn { background:#fef3c7; color:#92400e; }
    .pill.bad  { background:#fee2e2; color:#b91c1c; }
    h2 { font-size:15px; margin:0 0 12px; }
    .plans { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    @media (max-width:560px) { .plans { grid-template-columns:1fr; } }
    .plan { border:2px solid var(--line); border-radius:10px; padding:14px 16px; cursor:pointer; background:#fff; text-align:left; }
    .plan[aria-pressed="true"] { border-color:var(--green); background:#f0fdf4; }
    .plan .amt { font-size:22px; font-weight:800; margin:2px 0; }
    .plan .note { font-size:12.5px; color:var(--muted); }
    .dc { font-size:11.5px; font-weight:700; color:#166534; background:#dcfce7;
          border-radius:999px; padding:1px 7px; margin-left:6px; }
    .btns { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:16px; }
    button.pay { border:0; border-radius:8px; padding:11px 18px; font-size:14.5px; font-weight:700; cursor:pointer; }
    .card-pay { background:var(--green); color:#fff; }
    .vbank-pay { background:#fff; color:#111827; border:1px solid #cfd4da !important; }
    button[disabled] { opacity:.5; cursor:not-allowed; }
    .hint { font-size:12.5px; color:var(--muted); }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-weight:600; font-size:12.5px; }
    .empty { color:var(--muted); font-size:14px; }
    .err { background:#fef2f2; border:1px solid #fecaca; color:#b91c1c;
           border-radius:8px; padding:12px 14px; font-size:14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top" id="page-top">
      <h1>💳 홈페이지유지관리</h1>
      <a href="/admin">← 관리자 화면으로</a>
    </div>
    <p class="sub">이 사이트를 운영·관리하는 데 드는 홈페이지 유지관리비입니다. 기한이 지나면 서비스가 중지될 수 있습니다.</p>
    <div id="body"><p class="empty">불러오는 중…</p></div>
  </div>

  <script src="https://pay.nicepay.co.kr/v1/js/"></script>
  <script>
  (function () {
    var B = null, CFG = null, USAGE = null, plan = 'monthly';
    function won(n) { return (Number(n) || 0).toLocaleString('ko-KR') + '원'; }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g,
      function (c) { return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' })[c]; }); }

    function duePill() {
      if (B.overdue) return '<span class="pill bad">기한 지남</span>';
      if (B.days_left === null || B.days_left === undefined) return '<span class="pill">기한 미정</span>';
      return '<span class="pill' + (B.days_left <= 7 ? ' warn' : '') + '">'
           + B.days_left + '일 남음</span>';
    }

    function render() {
      var payable = CFG && CFG.enabled;
      document.getElementById('body').innerHTML =
        '<div class="card"><div class="row">'
      +   '<div><div class="lbl">월 이용료</div><div class="fee">' + won(B.monthly_fee) + '</div></div>'
      +   '<div class="due"><div class="lbl">납부 기한</div><b>' + esc(B.paid_until || '미정') + '</b>'
      +     '<div>' + duePill() + '</div></div>'
      + '</div></div>'

      + '<div class="card"><h2>결제하기</h2><div class="plans">'
      +   '<button class="plan" data-plan="monthly" aria-pressed="true">'
      +     '<div class="lbl">월 결제</div><div class="amt">' + won(B.monthly_fee) + '</div>'
      +     '<div class="note">매달 청구</div></button>'
      +   '<button class="plan" data-plan="annual" aria-pressed="false">'
      +     '<div class="lbl">1년 선결제<span class="dc">' + (B.annual_dc_pct || 0) + '% 할인</span></div>'
      +     '<div class="amt">' + won(B.annual_fee) + '</div>'
      +     '<div class="note">' + won((B.monthly_fee || 0) * 12) + ' → ' + won(B.annual_fee)
      +       ' (' + won(B.annual_save) + ' 절약)</div></button>'
      + '</div><div class="btns">'
      +   '<button class="pay card-pay" id="pay-card"' + (payable ? '' : ' disabled') + '>카드로 결제</button>'
      // 가상계좌는 2026-09-14 에 감췄다.
      // ⚠️ 이 상점은 가상계좌가 열려 있지 않아 누르면 나이스페이가
      //    «[W004] 결제수단이 유효하지 않습니다» 로 막는다. 눌러 봐야 혼란만 준다.
      //    나중에 열리면 아래 한 줄만 되살리면 된다(pay('vbank') 는 그대로 있다).
      // +   '<button class="pay vbank-pay" id="pay-vbank"' + (payable ? '' : ' disabled') + '>가상계좌 받기</button>'
      +   '<span class="hint">' + (payable
            ? '결제하시면 카드 매출전표(영수증)가 바로 발행됩니다.'
            : '결제 설정이 아직 준비되지 않았습니다. 서비스 제공자에게 문의해 주세요.') + '</span>'
      + '</div></div>'

      + compareBox(B, USAGE)
      + '<div class="card"><h2>안내 문자 받을 번호</h2>'
      +   '<div class="hint" style="margin:-4px 0 12px">납부 기한 <b>7일 · 3일 · 1일 전과 당일</b>'
      +     '에 한 번씩 문자로 알려 드립니다.</div>'
      +   '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'
      +     '<input type="tel" id="alert-phone" maxlength="13" placeholder="010-0000-0000" '
      +       'style="width:170px;padding:10px 12px;border:1px solid #cfd4da;border-radius:8px;font-size:15px">'
      +     '<label style="display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer">'
      +       '<input type="checkbox" id="alert-on"> 문자 받기</label>'
      +     '<button class="pay vbank-pay" id="alert-save" style="padding:10px 16px">저장</button>'
      +     '<span class="hint" id="alert-msg" style="flex:1"></span>'
      +   '</div>'
      + '</div>'

      + '<div class="card"><h2>납부 내역</h2>' + history() + '</div>'
      + '<p class="hint">문의는 서비스 제공자에게 연락해 주세요.</p>';

      Array.prototype.forEach.call(document.querySelectorAll('.plan'), function (el) {
        el.onclick = function () {
          plan = el.getAttribute('data-plan');
          Array.prototype.forEach.call(document.querySelectorAll('.plan'), function (o) {
            o.setAttribute('aria-pressed', o === el ? 'true' : 'false');
          });
        };
      });
      initAlert();
      _tellHeight();
      var c = document.getElementById('pay-card'), v = document.getElementById('pay-vbank');
      if (c) c.onclick = function () { pay('card'); };
      if (v) v.onclick = function () { pay('vbank'); };   // 지금은 단추가 없다(위 주석 참고)
    }

    function history() {
      var rows = B.payments || [];
      if (!rows.length) return '<p class="empty">아직 납부 내역이 없습니다.</p>';
      var h = '<table><tr><th>날짜</th><th>구분</th><th>금액</th><th>상태</th><th>비고</th><th>영수증</th></tr>';
      rows.forEach(function (r) {
        var when = r.at || ((r.year || '') + '-' + String(r.month || '').padStart(2, '0'));
        h += '<tr><td>' + esc(when) + '</td>'
           + '<td>' + (r.plan === 'annual' ? '1년' : r.plan === 'monthly' ? '월' : esc(r.memo || '')) + '</td>'
           + '<td>' + won(r.amount) + '</td>'
           + '<td>' + (r.status === 'vbankReady' ? '입금 대기'
                       : r.status === 'paid' ? '완료'
                       : r.status === 'cancelled' ? '취소됨' : esc(r.status || '완료')) + '</td>'
           + '<td class="hint">' + esc(r.memo || '') + '</td>'
           + '<td>' + (r.receipt
                ? '<a href="#" onclick="openReceipt(\'' + esc(r.tid || '') + '\');return false;">보기</a>'
                : '<span class="empty">-</span>') + '</td></tr>';
      });
      return h + '</table>';
    }


/* 영수증 모달 — 새 창 대신 이 자리에서 보여 준다 (2026-09-15).
   ⚠️ 인쇄할 때는 **영수증만** 나가야 한다. iframe 을 직접 인쇄해서
      바깥 화면(메뉴·목록)이 종이에 딸려 나가지 않게 한다. */
window.openReceipt = function (tid) {
  if (!tid) return;
  var w = document.createElement('div');
  w.id = 'rc-overlay';
  w.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(15,23,42,.55);'
                  + 'display:flex;align-items:center;justify-content:center;padding:18px';
  w.innerHTML =
    '<div style="background:#fff;border-radius:14px;width:100%;max-width:600px;'
  + 'max-height:92vh;display:flex;flex-direction:column;overflow:hidden;'
  + 'box-shadow:0 24px 64px rgba(0,0,0,.35)">'
  +   '<div style="display:flex;align-items:center;gap:8px;padding:12px 16px;'
  +     'border-bottom:1px solid #e6e9ec">'
  +     '<b style="flex:1;font-size:15.5px">영수증</b>'
  +     '<button id="rc-print" style="border:0;border-radius:8px;padding:8px 14px;'
  +       'background:#16a34a;color:#fff;font-weight:700;font-size:13.5px;cursor:pointer">인쇄</button>'
  +     '<button id="rc-close" style="border:1px solid #cfd4da;background:#fff;border-radius:8px;'
  +       'padding:8px 12px;font-size:13.5px;cursor:pointer">닫기</button>'
  +   '</div>'
  +   '<iframe id="rc-frame" src="/api/server-billing/receipt?tid=' + encodeURIComponent(tid) + '"'
  +     ' style="flex:1;width:100%;min-height:460px;border:0"></iframe>'
  + '</div>';
  document.body.appendChild(w);

  function close() { w.remove(); document.removeEventListener('keydown', esc); }
  function esc(e) { if (e.key === 'Escape') close(); }
  document.addEventListener('keydown', esc);
  w.querySelector('#rc-close').onclick = close;
  // 바깥을 눌러 닫기 — 누른 자리와 뗀 자리가 **둘 다** 바깥일 때만(글자 끌기 방지)
  var down = false;
  w.addEventListener('mousedown', function (e) { down = (e.target === w); });
  w.addEventListener('mouseup', function (e) { if (down && e.target === w) close(); down = false; });
  w.querySelector('#rc-print').onclick = function () {
    var f = document.getElementById('rc-frame');
    try { f.contentWindow.focus(); f.contentWindow.print(); }
    catch (e) { window.open(f.src, '_blank'); }
  };
};


    /* 안내 문자 번호 — 치는 대로 `-` 가 들어가고, 저장은 관리자만 된다. */
    function dashPhone(v) {
      var d = String(v || '').replace(/\D/g, '').slice(0, 11);
      if (!d) return '';
      if (d.indexOf('02') === 0) {
        if (d.length < 3) return d;
        if (d.length < 6) return d.slice(0,2) + '-' + d.slice(2);
        if (d.length < 10) return d.slice(0,2) + '-' + d.slice(2,5) + '-' + d.slice(5);
        return d.slice(0,2) + '-' + d.slice(2,6) + '-' + d.slice(6,10);
      }
      if (d.length < 4) return d;
      if (d.length < 8) return d.slice(0,3) + '-' + d.slice(3);
      if (d.length < 11) return d.slice(0,3) + '-' + d.slice(3,6) + '-' + d.slice(6);
      return d.slice(0,3) + '-' + d.slice(3,7) + '-' + d.slice(7);
    }

    function initAlert() {
      var el = document.getElementById('alert-phone');
      if (!el) return;
      el.value = dashPhone((B && B.alert_phone) || '');
      document.getElementById('alert-on').checked = !!(B && B.alert_on);
      el.oninput = function () { el.value = dashPhone(el.value); };
      document.getElementById('alert-save').onclick = saveAlert;
    }

    async function saveAlert() {
      var msg = document.getElementById('alert-msg');
      var phone = document.getElementById('alert-phone').value.trim();
      var on = document.getElementById('alert-on').checked;
      if (on && phone.replace(/\D/g, '').length < 10) {
        msg.innerHTML = '<span style="color:#b91c1c">번호를 정확히 넣어 주세요.</span>'; return;
      }
      var tok = null;
      try { tok = localStorage.getItem('access_token') || sessionStorage.getItem('access_token'); } catch (e) {}
      if (!tok) { msg.innerHTML = '<span style="color:#b91c1c">관리자로 로그인해 주세요.</span>'; return; }
      msg.textContent = '저장하는 중…';
      try {
        // ⚠️ 주소 끝의 `/` 를 빠뜨리면 Django 가 되돌려보내며 POST 본문이 사라진다.
        var r = await fetch('/api/server-billing/alert/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok },
          body: JSON.stringify({ phone: phone, alert_on: on })
        });
        var j = await r.json();
        if (!r.ok || j.ok === false) {
          msg.innerHTML = '<span style="color:#b91c1c">' + (j.error || '저장하지 못했습니다.') + '</span>';
          return;
        }
        msg.innerHTML = '<span style="color:#137333">저장했습니다.</span>';
        setTimeout(function () { msg.textContent = ''; }, 2500);
      } catch (e) {
        msg.innerHTML = '<span style="color:#b91c1c">저장하지 못했습니다.</span>';
      }
    }

        /* 「cafe24 대비 얼마나 저렴한가 + 지금 얼마나 쓰고 있나」 (2026-09-15)
       ⚠️ 기준은 cafe24 호스팅 「자이언트플러스」 (월 55,000원·설치비 22,000원,
          RAM 6GB · SSD 150GB · 트래픽 1.5TB/월, 2026-09 조회).
       ⚠️ 우리 컨테이너에는 메모리·CPU **한도를 걸어 두지 않았다.** 그러니 「할당량」이라고
          말하면 거짓이다. **실제로 쓰고 있는 양**을 보여 주고 cafe24 상한과 견주게 한다. */
    function compareBox(B, U) {
      var CAFE_MONTH = 55000, CAFE_SETUP = 22000, DOMAIN_YEAR = 22000;
      var CAFE = { ram: '6GB', ssd: '150GB', traffic: '1.5TB/월' };

      var won = function (n) { return (Number(n) || 0).toLocaleString('ko-KR') + '원'; };
      var MB = function (b) { return (Number(b) || 0) / 1048576; };
      var size = function (b) {
        var m = MB(b);
        return m >= 1024 ? (m / 1024).toFixed(2) + ' GB' : m.toFixed(0) + ' MB';
      };

      var ourMonthYear = (B.monthly_fee || 0) * 12;
      var ourAnnual = B.annual_fee || 0;
      var cafeFirst = CAFE_MONTH * 12 + CAFE_SETUP + DOMAIN_YEAR;
      var cafeNext = CAFE_MONTH * 12 + DOMAIN_YEAR;
      var saveAnnual = cafeFirst - ourAnnual;

      var row = function (label, v, strong) {
        return '<tr><td style="padding:7px 0;color:#6b7280">' + label + '</td>'
             + '<td style="padding:7px 0;text-align:right;'
             + (strong ? 'font-weight:800' : '') + '">' + v + '</td></tr>';
      };

      /* 지금 쓰는 양 — 값이 없으면 이 칸을 통째로 뺀다(거짓말하지 않는다) */
      var useBox = '';
      if (U && U.containers) {
        var bar = function (label, now, cap, pct) {
          var w = Math.max(1, Math.min(100, pct));
          var col = w >= 90 ? '#c5221f' : (w >= 70 ? '#a15c00' : '#16a34a');
          return '<div style="margin-bottom:10px">'
            + '<div style="display:flex;justify-content:space-between;font-size:12.5px;'
            +   'color:#6b7280;margin-bottom:3px"><span>' + label + '</span>'
            +   '<span><b style="color:#111827">' + now + '</b>'
            +   (cap ? ' <span style="opacity:.7">/ cafe24 상한 ' + cap + '</span>' : '') + '</span></div>'
            + '<div style="height:6px;border-radius:4px;background:#eef0f2;overflow:hidden">'
            +   '<div style="height:100%;width:' + w + '%;background:' + col + '"></div></div>'
            + '</div>';
        };
        var memPct = MB(U.mem_bytes) / (6 * 1024) * 100;          // 6GB 대비
        var diskPct = MB(U.disk_bytes) / (150 * 1024) * 100;      // 150GB 대비
        useBox = ''
          + '<div style="margin-top:16px;padding:16px;border:1px solid #e5e7eb;border-radius:10px">'
          +   '<div style="font-size:13.5px;font-weight:700;margin-bottom:12px">'
          +     '지금 이 사이트가 쓰고 있는 양'
          +     '<span style="font-weight:400;color:#6b7280;font-size:12px"> · 실시간</span></div>'
          +   bar('메모리', size(U.mem_bytes), CAFE.ram, memPct)
          +   bar('디스크', size(U.disk_bytes), CAFE.ssd, diskPct)
          +   '<div style="display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:#6b7280;'
          +     'border-top:1px solid #eef0f2;padding-top:10px;margin-top:4px">'
          +     '<span>CPU <b style="color:#111827">' + (U.cpu_pct || 0).toFixed(2) + '%</b></span>'
          +     '<span>주고받은 자료 <b style="color:#111827">'
          +       size(U.net_rx) + ' / ' + size(U.net_tx) + '</b>'
          +       '<span style="opacity:.8"> (다시 시작한 뒤부터)</span></span>'
          +   '</div>'
          +   '<div style="font-size:12px;color:#6b7280;margin-top:8px;line-height:1.6">'
          +     '⚠️ 이 서버는 <b>따로 상한을 두지 않습니다.</b> 위 막대는 같은 값을 cafe24 '
          +     '자이언트플러스 요금제였다면 어디쯤이었을지 견준 것입니다.'
          +   '</div>'
          + '</div>';
      }

      return ''
      + '<div class="card">'
      +   '<h2 style="margin-bottom:4px">얼마나 절약되나요?</h2>'
      +   '<div style="font-size:12.5px;color:#6b7280;margin-bottom:14px">'
      +     'cafe24 호스팅 <b>자이언트플러스</b> 기준 — 월 ' + won(CAFE_MONTH)
      +     ' · 설치비 ' + won(CAFE_SETUP) + ' · RAM ' + CAFE.ram + ' · SSD ' + CAFE.ssd
      +     ' · 트래픽 ' + CAFE.traffic + ' (2026-09 조회)'
      +   '</div>'

      +   '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'
      +     '<div style="border:1px solid #e5e7eb;border-radius:10px;padding:14px 16px">'
      +       '<div style="font-size:13px;color:#6b7280;margin-bottom:8px">cafe24 로 직접 쓸 때</div>'
      +       '<table style="width:100%;border-collapse:collapse;font-size:13.5px">'
      +         row('월 사용료 ×12', won(CAFE_MONTH * 12))
      +         row('설치비', won(CAFE_SETUP))
      +         row('도메인 유지관리', won(DOMAIN_YEAR))
      +         row('<b>첫 1년 합계</b>', '<b>' + won(cafeFirst) + '</b>', true)
      +       '</table>'
      +       '<div style="font-size:12px;color:#6b7280;margin-top:8px;border-top:1px solid #eef0f2;'
      +         'padding-top:8px">RAM ' + CAFE.ram + ' · SSD ' + CAFE.ssd
      +         ' · 트래픽 ' + CAFE.traffic + '<br>초과 트래픽 165원/GB</div>'
      +     '</div>'
      +     '<div style="border:2px solid #16a34a;border-radius:10px;padding:14px 16px;background:#f0fdf4">'
      +       '<div style="font-size:13px;color:#166534;margin-bottom:8px;font-weight:700">지금 이 서비스</div>'
      +       '<table style="width:100%;border-collapse:collapse;font-size:13.5px">'
      +         row('월 결제 ×12', won(ourMonthYear))
      +         row('1년 선결제 <span style="color:#166534">(' + (B.annual_dc_pct || 0) + '% 할인)</span>',
                   won(ourAnnual))
      +         row('설치비', '<span style="color:#166534">없음</span>')
      +         row('도메인 유지관리', '<span style="color:#166534">포함</span>')
      +       '</table>'
      +       '<div style="font-size:12px;color:#166534;margin-top:8px;border-top:1px solid #d1fae5;'
      +         'padding-top:8px">상한 없음 · 초과 트래픽 요금 없음<br>NVMe SSD · 전용 서버</div>'
      +     '</div>'
      +   '</div>'

      +   '<div style="margin-top:14px;padding:14px 16px;border-radius:10px;'
      +     'background:#ecfdf5;border:1px solid #a7f3d0;text-align:center">'
      +     '<div style="font-size:13.5px;color:#065f46">1년 선결제로 쓰시면 첫 해에</div>'
      +     '<div style="font-size:26px;font-weight:800;color:#047857;letter-spacing:-.5px;margin:2px 0">'
      +       won(saveAnnual) + ' 절약'
      +     '</div>'
      +     '<div style="font-size:12.5px;color:#059669">'
      +       '다음 해부터도 매년 ' + won(cafeNext - ourAnnual) + ' 절약 · '
      +       '월 결제로 쓰셔도 첫 해 ' + won(cafeFirst - ourMonthYear) + ' 절약'
      +     '</div>'
      +   '</div>'

      +   useBox

      +   '<div style="margin-top:12px;font-size:12.5px;color:#6b7280;line-height:1.65">'
      +     '<b>부가 서비스</b> — 도메인 유지관리비(연 ' + won(DOMAIN_YEAR) + ')가 요금에 포함되어 있습니다. '
      +     '설치비도 받지 않습니다.'
      +   '</div>'
      + '</div>';
    }


    /* 관리자 탭 안(iframe)에 들어간 경우 (2026-09-15)
       ⚠️ 바깥 화면에 이미 제목과 탭이 있다. 여기 머리말·배경까지 나오면 두 겹이 된다.
       ⚠️ iframe 은 제 높이를 모른다 → 안쪽에서 재서 바깥에 알려 준다. */
    var _EMBED = new URLSearchParams(location.search).get('embed') === '1';
    if (_EMBED) {
      document.documentElement.style.background = '#fff';
      document.body.style.background = '#fff';
      var _t = document.getElementById('page-top');
      if (_t) _t.style.display = 'none';
      var _w = document.querySelector('.wrap');
      if (_w) { _w.style.padding = '4px 2px 8px'; _w.style.maxWidth = '100%'; }
    }

    function _tellHeight() {
      if (!_EMBED) return;
      try {
        var h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
        parent.postMessage({ type: 'billing-height', height: h }, location.origin);
      } catch (e) {}
    }
    if (_EMBED) {
      setInterval(_tellHeight, 700);          // 값이 늦게 와서 길이가 변하는 화면이다
      window.addEventListener('load', _tellHeight);
    }

function pay(method) {
      if (!CFG || !CFG.enabled) return;
      if (typeof AUTHNICE === 'undefined') {
        alert('결제창을 불러오지 못했습니다. 잠시 뒤 다시 시도해 주세요.');
        return;
      }
      var amount = plan === 'annual' ? B.annual_fee : B.monthly_fee;
      var req = {
        clientId: CFG.client_key,
        method: method,
        orderId: 'ddgolf-' + plan + '-' + Date.now(),
        amount: amount,
        // 카드 매출전표(영수증)에 찍히는 품목 이름 — 교수오빠 지정(2026-09-14)
        goodsName: '홈페이지유지관리비 (' + (plan === 'annual' ? '1년' : '1개월') + ')',
        mallReserved: 'ddgolf::' + plan,
        // 구매자 정보 — **영수증 조회에 쓰인다** (2026-09-15).
        // ⚠️ 안 보내면 나이스페이 「영수증 확인」에서 구매자명으로 찾을 수 없다.
        buyerName: '대덕구골프협회',
        returnUrl: location.origin + '/api/server-billing/return',
        fnError: function (r) { alert('결제를 시작하지 못했습니다: ' + (r && r.errorMsg || '')); }
      };
      // ⚠️ 가상계좌는 **예금주명이 필수**다. 없으면 결제창이 아예 안 뜨고
      //    「[P007] 필수 파라미터 예금주명:vbankHolder가 없습니다」로 막힌다.
      if (method === 'vbank') {
        req.vbankHolder = '대덕구골프협회';
        // ⚠️ 날짜는 **ISO8601(YYYY-MM-DD)** 이어야 한다. YYYYMMDD 로 보내면 [P024] 로 막힌다.
        var d = new Date(Date.now() + 3 * 864e5);          // 입금 기한 3일
        req.vbankExpDate = d.getFullYear() + '-'
          + String(d.getMonth() + 1).padStart(2, '0') + '-'
          + String(d.getDate()).padStart(2, '0');
      }
      AUTHNICE.requestPay(req);
    }

    window.addEventListener('message', function (e) {
      if (e.data === 'nicepay:success') setTimeout(function () { location.reload(); }, 800);
    });

    Promise.all([
      fetch('/api/server-billing').then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); }),
      fetch('/api/server-billing/pay-config').then(function (r) { return r.ok ? r.json() : { enabled: false }; })
        .catch(function () { return { enabled: false }; })
    ]).then(function (a) {
      B = a[0]; CFG = a[1]; render();
      // 사용량은 늦게 와도 화면을 막지 않는다 — 오면 그때 한 번 더 그린다
      fetch('/api/server-billing/usage')
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (u) { if (u && u.containers) { USAGE = u; render(); } })
        .catch(function () {});
    }).catch(function (e) {
      // ⚠️ 까닭을 삼키지 않는다. 전에 화면이 비어 있는데 무엇이 잘못됐는지 알 수 없었다.
      try { console.error('[유지관리비]', e); } catch (x) {}
      document.getElementById('body').innerHTML =
        '<div class="err">요금 정보를 불러오지 못했습니다. 잠시 뒤 다시 시도해 주세요.'
        + '<div style="margin-top:6px;font-size:12px;opacity:.8">' + String(e && e.message || e) + '</div></div>';
    });
  })();
  </script>
</body>
